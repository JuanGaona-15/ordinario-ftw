<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUEGOS</title>
    <link rel="stylesheet" href="juegosEstilo.css">
</head>
<body>

  <div class="ventana-archivo">

    <header class="header-inicio">
        <h1>Los juegos favoritos de mi archivo</h1>
    </header>

    <nav class="menu-navegacion">
        <button id="REPORTAJES" onclick="document.location='reportajes.html'">REPORTAJES</button>
        <button id="PLATAFORMAS" onclick="document.location='plataformas.html'">PLATAFORMAS</button>
        <button id="JUEGOS" onclick="document.location='juegos.html'">JUEGOS</button>
        <button id="GENEROS" onclick="document.location='generos.html'">GENEROS</button>
        <button id="VIDEOS" onclick="document.location='videos.html'">VIDEOS</button>
        <button id="ARCHIVO" onclick="document.location='archivo.html'">ARCHIVO</button>
    </nav>

    <div class="catalogo">
        <button id="cargarjuegos">¡Cargar catálogo!</button>
        
        <div class="contenedor-filtros">
            <input type="text" id="buscador" placeholder="Buscar por título, desarrollador o ID" disabled>
            
            <select id="filtro-genero" disabled>
                <option value="todos">Todos los géneros</option>
                <option value="Accion">Acción</option>
                <option value="Disparos">Disparos</option>
                <option value="Ritmo">Ritmo</option>
                <option value="Carreras">Carreras</option>
                <option value="RPG">RPG</option>
                <option value="Acertijos">Acertijos</option>
            </select>
        </div>

        <script src="juegosJS.js"></script>

        <table class="tabla-catalogo">
            <thead>
                <tr>
                    <th>TÍTULO</th>
                    <th>AÑO</th>
                    <th>GÉNERO</th>
                    <th>DESARROLLADOR</th>
                    <th>DESCRIPCIÓN</th>
                </tr>
            </thead>
            <tbody id="tabla-contenido"></tbody>
        </table>
    </div>

    <div class="contenedor-boton-home">
        <button class="home" onclick="document.location='main.html'">HOME</button>
    </div>

  </div> 
</body>
</html>
